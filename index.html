<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sermon Transcript</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        color: #fff;
        font-family: "Inter", system-ui, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #main {
        flex: 1;
        overflow-y: auto;
        padding: 60px 80px 6.5vh;
        will-change: scroll-position;
        -webkit-overflow-scrolling: touch;
      }

      /* Top-edge fade — fixed overlay so it never affects scroll compositing */
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: linear-gradient(to bottom, #000, transparent);
        pointer-events: none;
        z-index: 10;
      }
      #main::-webkit-scrollbar {
        width: 0;
      }

      /* Each segment block — fade in only, no translateY shift
         (vertical shift fights scroll positioning and causes jitter) */
      .entry {
        margin-bottom: var(--chunk-spacing, 60px);
        animation: fadeIn 0.45s ease forwards;
        opacity: 0;
      }
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      /* Each sentence on its own line */
      .sentence {
        display: block;
        font-size: var(--sentence-size, 83px);
        line-height: var(--line-height, 1.5);
        font-weight: 300;
        color: #fff;
        margin-bottom: 8px;
      }
      .sentence:last-child {
        margin-bottom: 0;
      }
      .sentence[contenteditable="true"]:hover {
        outline: 1px solid #2a2a2a;
        outline-offset: 2px;
        border-radius: 2px;
      }
      .sentence[contenteditable="true"]:focus {
        outline: 1px solid #444;
        outline-offset: 3px;
        border-radius: 2px;
      }

      /* Scripture reference — inline, same size as sentences */
      .scripture-callout {
        display: block;
        font-size: var(--sentence-size, 83px);
        line-height: var(--line-height, 1.5);
        font-weight: 300;
        color: #666;
        margin-bottom: 8px;
      }

      /* Music / instrument detected */
      .music-label {
        display: block;
        margin-bottom: var(--chunk-spacing, 60px);
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #666;
        animation: fadeIn 0.45s ease forwards;
        opacity: 0;
      }
      .music-label::before {
        content: "\266a\0020\0020";
      }

      /* Console toggle button - gear icon */
      #console-btn {
        position: fixed;
        bottom: 20px;
        right: 22px;
        background: none;
        border: none;
        color: #666;
        font-size: 22px;
        cursor: pointer;
        padding: 6px;
        transition: color 0.2s;
        z-index: 100;
        line-height: 1;
      }
      #console-btn:hover {
        color: #aaa;
      }

      /* Console drawer */
      #console-drawer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #0a0a0a;
        border-top: 1px solid #1e1e1e;
        transform: translateY(100%);
        transition: transform 0.25s ease;
        z-index: 99;
        display: flex;
        flex-direction: column;
        height: 40vh;
        min-height: 160px;
        max-height: 90vh;
      }
      #console-drawer.open {
        transform: translateY(0);
      }

      /* Resize handle */
      #resize-handle,
      .resize-handle {
        height: 24px;
        cursor: ns-resize;
        background: transparent;
        border-bottom: 1px solid #1a1a1a;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #resize-handle::after,
      .resize-handle::after {
        content: "";
        width: 40px;
        height: 4px;
        background: #444;
        border-radius: 4px;
        display: block;
      }
      #resize-handle:hover::after,
      .resize-handle:hover::after,
      #resize-handle:active::after,
      .resize-handle:active::after {
        background: #666;
      }

      #console-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        border-bottom: 1px solid #1a1a1a;
        flex-shrink: 0;
      }
      #console-header span {
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #666;
      }

      #console-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid #1a1a1a;
        flex-shrink: 0;
        flex-wrap: wrap;
      }

      select {
        background: #111;
        border: 1px solid #2a2a2a;
        border-radius: 4px;
        padding: 8px 12px;
        color: #fff;
        font-family: "Inter", sans-serif;
        font-size: 14px;
        outline: none;
        cursor: pointer;
      }

      .btn {
        padding: 8px 20px;
        border-radius: 4px;
        border: 1px solid #2a2a2a;
        font-family: "Inter", sans-serif;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
        background: transparent;
      }
      .btn-start {
        background: #fff;
        color: #000;
        border-color: #fff;
      }
      .btn-start:hover {
        background: #ddd;
      }
      .btn-stop {
        color: #e55;
        border-color: #e55;
      }
      .btn-stop:hover {
        background: rgba(220, 50, 50, 0.08);
      }
      .btn-muted {
        color: #555;
      }
      .btn-muted:hover {
        color: #aaa;
        border-color: #666;
      }

      #log-panel {
        flex: 1;
        overflow-y: auto;
        padding: 10px 20px;
        -ms-overflow-style: none; /* Internet Explorer and Edge */
        scrollbar-width: none; /* Firefox */
      }
      #log-panel::-webkit-scrollbar {
        width: 2px;
      }
      #log-panel::-webkit-scrollbar-thumb {
        background: #222;
      }
      .log {
        font-family: monospace;
        font-size: 12px;
        line-height: 1.8;
        color: #3a3;
      }
      .log.err {
        color: #e55;
      }
      .log.warn {
        color: #b83;
      }
      .log.info {
        color: #48f;
      }

      /* Remote control bar (phone view) */
      /* Remote status indicator */
      .remote-status {
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .remote-status.live {
        color: #3a3;
      }
      .remote-status.ready {
        color: #555;
      }
      .remote-status.offline {
        color: #e55;
      }

      #toast {
        position: fixed;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        background: #1a0000;
        color: #faa;
        padding: 10px 18px;
        border-radius: 4px;
        font-size: 12px;
        max-width: 400px;
        display: none;
        z-index: 999;
        border: 1px solid #500;
        text-align: center;
        line-height: 1.5;
      }

      /* Typography controls */
      .control-group {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 4px;
        border-left: 1px solid #1e1e1e;
      }
      .control-group:first-child {
        border-left: none;
      }
      .control-label {
        font-size: 13px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #666;
        white-space: nowrap;
      }
      .slider {
        -webkit-appearance: none;
        width: 90px;
        height: 5px;
        background: #2a2a2a;
        border-radius: 3px;
        outline: none;
        cursor: pointer;
      }
      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #888;
        cursor: pointer;
        transition: background 0.15s;
      }
      .slider::-webkit-slider-thumb:hover {
        background: #bbb;
      }
      /* Firefox slider thumb */
      .slider::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #888;
        border: none;
        cursor: pointer;
        transition: background 0.15s;
      }
      .slider::-moz-range-thumb:hover {
        background: #bbb;
      }

      input[type="number"],
      input[type="text"] {
        background: #111;
        border: 1px solid #2a2a2a;
        border-radius: 4px;
        padding: 7px 10px;
        color: #fff;
        font-size: 14px;
        outline: none;
        font-family: "Inter", sans-serif;
      }
      input[type="number"] {
        width: 60px;
        -moz-appearance: textfield;
      }
      input[type="number"]::-webkit-inner-spin-button {
        opacity: 0.4;
      }
      #sermon-title-input,
      #remote-sermon-title-input {
        width: 160px;
      }

      /* Sermon title — styled identically to transcript sentences */
      #sermon-title-display {
        display: none;
        font-size: var(--sentence-size, 83px);
        line-height: var(--line-height, 1.5);
        font-weight: 300;
        color: #fff;
        margin-bottom: 8px;
      }

      /* Metrics panel */
      #metrics-panel,
      .metrics-panel-toggle {
        display: none;
        padding: 10px 20px;
        border-bottom: 1px solid #1a1a1a;
        flex-shrink: 0;
        max-height: 200px;
        overflow-y: auto;
      }
      #metrics-panel.open,
      .metrics-panel-toggle.open {
        display: block;
      }
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .metric-card {
        background: #111;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        padding: 8px 10px;
      }
      .metric-card h4 {
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #666;
        margin: 0 0 6px 0;
        font-weight: 400;
      }
      .meter-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 10px;
        color: #888;
      }
      .meter-label {
        width: 50px;
        text-align: right;
        flex-shrink: 0;
      }
      .meter-bar {
        flex: 1;
        height: 6px;
        background: #1a1a1a;
        border-radius: 3px;
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        border-radius: 3px;
        transition:
          width 0.3s,
          background 0.3s;
      }
      .meter-fill.green {
        background: #3a3;
      }
      .meter-fill.yellow {
        background: #b83;
      }
      .meter-fill.red {
        background: #e55;
      }
      .meter-value {
        width: 70px;
        font-family: monospace;
        font-size: 10px;
      }
      .metric-detail {
        font-size: 10px;
        color: #555;
        margin-top: 2px;
      }

      /* Remote console drawer — mirrors #console-drawer */
      #remote-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #0a0a0a;
        border-top: 1px solid #1e1e1e;
        transform: translateY(100%);
        transition: transform 0.25s ease;
        z-index: 200;
        display: flex;
        flex-direction: column;
        height: 40vh;
        min-height: 160px;
        max-height: 90vh;
      }
      #remote-panel.open {
        transform: translateY(0);
      }

      /* Viewer panel — read-only spectator controls */
      #viewer-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #0a0a0a;
        border-top: 1px solid #1e1e1e;
        transform: translateY(100%);
        transition: transform 0.25s ease;
        z-index: 200;
        display: flex;
        flex-direction: column;
        height: 200px;
        min-height: 160px;
        max-height: 90vh;
      }
      #viewer-panel.open {
        transform: translateY(0);
      }

      /* Mobile responsive */
      @media (max-width: 600px) {
        .metrics-grid {
          grid-template-columns: 1fr;
        }
        .control-group {
          border-left: none;
          width: 100%;
          flex-wrap: wrap;
        }
        /* Slider groups: label full-width, then slider fills remaining space */
        .control-group:has(.slider) .control-label {
          width: 100%;
          margin-bottom: 2px;
        }
        .control-group:has(.slider) {
          display: flex;
          flex-wrap: wrap;
        }
        .control-group:has(.slider) .slider {
          flex: 1;
          min-width: 0;
        }
        #console-controls {
          padding: 10px 12px;
          gap: 8px;
        }
        .slider,
        input[type="range"] {
          width: 100%;
          height: 8px;
        }
        .slider::-webkit-slider-thumb {
          width: 22px;
          height: 22px;
        }
        .slider::-moz-range-thumb {
          width: 22px;
          height: 22px;
        }
        input[type="number"] {
          width: 56px;
          padding: 9px 10px;
          font-size: 15px;
          flex-shrink: 0;
        }
        .btn {
          padding: 10px 18px;
          font-size: 15px;
        }
        select {
          padding: 10px 12px;
          font-size: 15px;
        }
        #sermon-title-input,
        #remote-sermon-title-input {
          width: 120px;
        }
        .meter-label {
          width: 40px;
        }
        .meter-value {
          width: 60px;
        }
        #remote-panel {
          height: 50vh;
          max-height: 80vh;
        }
        #remote-download {
          display: none;
        }
        #viewer-panel {
          height: 250px;
          max-height: 80vh;
        }
        #main {
          padding: 20px 16px 60px;
        }
        body::after {
          height: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div id="sermon-title-display"></div>
      <div id="transcript"></div>
    </div>

    <button id="console-btn" onclick="toggleConsole()" title="Admin Console">
      &#9881;
    </button>

    <div id="console-drawer">
      <div id="resize-handle"></div>
      <div id="console-header">
        <span>Admin Console</span>
        <span
          id="queue-depth"
          style="
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-left: auto;
            margin-right: 16px;
          "
        ></span>
        <button
          class="btn btn-muted"
          style="padding: 6px 14px; font-size: 13px"
          onclick="toggleMetricsPanel()"
        >
          Metrics
        </button>
        <button
          class="btn btn-muted"
          style="padding: 6px 14px; font-size: 13px"
          onclick="popOutConsole()"
          title="Pop out console"
        >
          &#8599;
        </button>
        <button
          class="btn btn-muted"
          style="padding: 6px 14px; font-size: 13px"
          onclick="toggleConsole()"
        >
          Close
        </button>
      </div>
      <div id="console-controls">
        <div class="control-group">
          <button class="btn btn-start" id="btn-start" onclick="startSession()">
            &#9654; Begin
          </button>
          <button
            class="btn btn-stop"
            id="btn-stop"
            onclick="stopSession()"
            style="display: none"
          >
            &#9632; Stop
          </button>
          <button class="btn btn-muted" id="btn-mute" onclick="toggleMute()">
            Mute
          </button>
          <button class="btn btn-muted" onclick="clearAll()">Clear</button>
          <button
            class="btn btn-muted"
            onclick="downloadTranscript('Manual download')"
          >
            &#8595; Download
          </button>
          <span
            id="sermon-timer"
            style="
              font-size: 13px;
              color: #666;
              margin-left: 8px;
              font-variant-numeric: tabular-nums;
            "
            >--:--</span
          >
          <span
            id="session-cost"
            style="font-size: 13px; color: #666; margin-left: 4px"
            >Cost: $0.00</span
          >
        </div>
        <div class="control-group">
          <span class="control-label">Title</span>
          <input
            type="text"
            id="sermon-title-input"
            placeholder="Sermon title/설교 제목&hellip;"
            oninput="setSermonTitle(this.value)"
          />
        </div>
        <div class="control-group">
          <span class="control-label">Max</span>
          <select id="chunk-ms" onchange="pushTypoSync()">
            <option value="20000">20s</option>
            <option value="25000" selected>25s</option>
            <option value="30000">30s</option>
          </select>
        </div>
        <div class="control-group">
          <span class="control-label">Font Size</span>
          <input
            type="range"
            class="slider"
            id="font-size-slider"
            min="24"
            max="175"
            value="83"
            oninput="
              applyTypographyLocal(this.value, null);
              document.getElementById('font-size-input').value = this.value;
            "
            onchange="applyTypography()"
          />
          <input
            type="number"
            id="font-size-input"
            min="24"
            max="175"
            value="83"
            oninput="
              applyTypographyLocal(this.value, null);
              document.getElementById('font-size-slider').value = this.value;
            "
            onchange="applyTypography()"
          />
        </div>
        <div class="control-group">
          <span class="control-label">Line spacing</span>
          <input
            type="range"
            class="slider"
            id="line-height-slider"
            min="10"
            max="40"
            value="15"
            oninput="
              applyTypographyLocal(null, this.value, null);
              document.getElementById('line-height-input').value = this.value;
            "
            onchange="applyTypography()"
          />
          <input
            type="number"
            id="line-height-input"
            min="10"
            max="40"
            value="15"
            oninput="
              applyTypographyLocal(null, this.value, null);
              document.getElementById('line-height-slider').value = this.value;
            "
            onchange="applyTypography()"
          />
        </div>
        <div class="control-group">
          <span class="control-label">Segment spacing</span>
          <input
            type="range"
            class="slider"
            id="chunk-spacing-slider"
            min="10"
            max="200"
            value="60"
            oninput="
              applyTypographyLocal(null, null, this.value);
              document.getElementById('chunk-spacing-input').value = this.value;
            "
            onchange="applyTypography()"
          />
          <input
            type="number"
            id="chunk-spacing-input"
            min="10"
            max="200"
            value="60"
            oninput="
              applyTypographyLocal(null, null, this.value);
              document.getElementById('chunk-spacing-slider').value =
                this.value;
            "
            onchange="applyTypography()"
          />
        </div>
        <div class="control-group">
          <span class="control-label">Scroll Speed</span>
          <input
            type="range"
            class="slider"
            id="scroll-speed-slider"
            min="40"
            max="500"
            value="77"
            oninput="
              scrollSpeed = parseInt(this.value);
              _lastLocalTypoTime = Date.now();
              document.getElementById('scroll-speed-input').value = this.value;
            "
            onchange="updateScrollSpeed()"
          />
          <input
            type="number"
            id="scroll-speed-input"
            min="40"
            max="500"
            value="77"
            oninput="
              scrollSpeed = parseInt(this.value);
              _lastLocalTypoTime = Date.now();
              document.getElementById('scroll-speed-slider').value = this.value;
            "
            onchange="updateScrollSpeed()"
          />
          <button
            class="btn btn-muted"
            id="btn-follow"
            onclick="resumeAutoScroll()"
            style="
              display: none;
              padding: 6px 14px;
              font-size: 13px;
              margin-left: 4px;
            "
          >
            &#8615; Go to bottom
          </button>
        </div>
      </div>
      <div id="metrics-panel">
        <div class="metrics-grid">
          <div class="metric-card">
            <h4>Claude (Anthropic)</h4>
            <div class="meter-row">
              <span class="meter-label">Requests</span>
              <div class="meter-bar">
                <div
                  class="meter-fill green"
                  id="claude-req-fill"
                  style="width: 0%"
                ></div>
              </div>
              <span class="meter-value" id="claude-req-val">—</span>
            </div>
            <div class="meter-row">
              <span class="meter-label">Tokens</span>
              <div class="meter-bar">
                <div
                  class="meter-fill green"
                  id="claude-tok-fill"
                  style="width: 0%"
                ></div>
              </div>
              <span class="meter-value" id="claude-tok-val">—</span>
            </div>
            <div class="metric-detail" id="claude-reset">Reset: —</div>
            <div class="metric-detail" id="claude-calls">Calls: 0</div>
          </div>
          <div class="metric-card">
            <h4>Groq (Whisper)</h4>
            <div class="meter-row">
              <span class="meter-label">Requests</span>
              <div class="meter-bar">
                <div
                  class="meter-fill green"
                  id="groq-req-fill"
                  style="width: 0%"
                ></div>
              </div>
              <span class="meter-value" id="groq-req-val">—</span>
            </div>
            <div class="meter-row">
              <span class="meter-label">Tokens</span>
              <div class="meter-bar">
                <div
                  class="meter-fill green"
                  id="groq-tok-fill"
                  style="width: 0%"
                ></div>
              </div>
              <span class="meter-value" id="groq-tok-val">—</span>
            </div>
            <div class="metric-detail" id="groq-reset">Reset: —</div>
            <div class="metric-detail" id="groq-calls">Calls: 0</div>
          </div>
          <div class="metric-card">
            <h4>Upstash (Redis)</h4>
            <div class="metric-detail" id="upstash-calls">Calls: 0</div>
          </div>
          <div class="metric-card">
            <h4>Session</h4>
            <div class="metric-detail" id="sermon-timer">--:--</div>
            <div class="metric-detail" id="session-cost">Cost: $0.00</div>
          </div>
        </div>
      </div>
      <div id="log-panel">
        <div id="log-entries"></div>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      // ═══════════════════════════════════════════════════════════════
      //  SERMON TRANSLATOR — Real-time Korean → English display
      //
      //  Architecture:
      //    Laptop (main)           Cloud (Redis)            Phone (remote)
      //    ─────────────           ─────────────            ──────────────
      //    Mic → Groq Whisper      Stores transcript,       Polls every 1.5s
      //    → Claude Sonnet         state, typography,       Shows transcript
      //    → Render on screen      edits, commands          + admin controls
      //    Pushes entries ───────► ◄─────────────── Sends commands
      //    Polls every 3s ───────► ◄─────────────── Polls every 1.5s
      //
      //  Pipeline per chunk:
      //    Record audio → Groq Whisper (KO STT, ~3s) → Claude (KO→EN, ~5s) → Render
      //
      //  Session lifecycle:
      //    - Start: resetSession() wipes context + Redis, then mic init
      //    - Clear: visual-only (pushes text off-screen, preserves context)
      //    - Stop: mic teardown, then resetSession() after 2s
      //
      //  Key design:
      //    - Chunks queued & processed one-at-a-time to preserve sermon order
      //    - Grace period prevents polls from overwriting mid-drag slider values
      //    - Bigram-frequency filter catches Whisper hallucinations on silence
      //    - Incremental Haiku summary keeps Claude context bounded over long sermons
      //    - Single sync-pull endpoint returns all state (entries, edits, typo, commands)
      // ═══════════════════════════════════════════════════════════════

      // ════════════════════════════════════════════════════════════
      //  SCROLL — pure teleprompter
      //  Always scrolls at a constant scrollSpeed px/s — no snapping,
      //  no jumping.  The loop stays alive while there's content below;
      //  when new text arrives, the loop just keeps going.
      // ════════════════════════════════════════════════════════════
      var autoScroll = true;
      var scrollSpeed = 77; // pixels per second
      var _scrollRAF = null;
      var _scrollLock = false;
      var _scrollTarget = 0;
      var _scrollLastT = 0;
      var _scrollSubPx = 0;
      var _lastLocalTypoTime = 0;
      var SCROLL_FILL_THRESHOLD = 0.65; // content must fill 65% of viewport to auto-scroll
      var _viewportFillCached = false; // cached result, avoids 60fps reflow

      // True when transcript content is tall enough to warrant scrolling
      function _contentFillsViewport() {
        return _viewportFillCached;
      }

      function _recheckViewportFill() {
        var transcript = document.getElementById("transcript");
        var main = document.getElementById("main");
        _viewportFillCached =
          transcript.offsetHeight >= main.clientHeight * SCROLL_FILL_THRESHOLD;
      }

      function _scrollStep(now) {
        var main = document.getElementById("main");
        var dt = (now - _scrollLastT) / 1000;
        _scrollLastT = now;
        if (dt > 0.1) dt = 0.1;

        // Not enough content yet — stay alive but don't move
        if (!_contentFillsViewport()) {
          _scrollLock = false;
          _scrollRAF = requestAnimationFrame(_scrollStep);
          return;
        }

        var maxScroll = main.scrollHeight - main.clientHeight;
        var remaining = maxScroll - main.scrollTop;
        _scrollTarget = maxScroll;

        if (remaining < 1) {
          // At the bottom — keep loop alive so new content is picked up
          _scrollLock = false;
          _scrollRAF = requestAnimationFrame(_scrollStep);
          return;
        }

        _scrollLock = true;

        // Constant speed, never overshoot
        var move = Math.min(scrollSpeed * dt, remaining);

        _scrollSubPx += move;
        var intMove = Math.floor(_scrollSubPx);
        if (intMove >= 1) {
          main.scrollTop += intMove;
          _scrollSubPx -= intMove;
        }

        _scrollRAF = requestAnimationFrame(_scrollStep);
      }

      // Ensure the scroll loop is running (idempotent)
      function scrollToBottom() {
        if (document.activeElement && document.activeElement.isContentEditable)
          return;
        if (!autoScroll) return;
        _recheckViewportFill(); // recompute once per content change, not 60fps
        if (_scrollRAF) return; // already running

        _scrollLastT = performance.now();
        _scrollSubPx = 0;
        _scrollRAF = requestAnimationFrame(_scrollStep);
      }

      // Stop the teleprompter loop (user grabbed the scroll)
      function cancelScrollAnim() {
        if (_scrollRAF) {
          cancelAnimationFrame(_scrollRAF);
          _scrollRAF = null;
        }
        _scrollLock = false;
        _scrollSubPx = 0;
      }

      // Follow button — snap to bottom immediately
      function resumeAutoScroll() {
        cancelScrollAnim();
        autoScroll = true;
        updateFollowBtn();
        _scrollLock = true;
        var main = document.getElementById("main");
        main.scrollTop = main.scrollHeight - main.clientHeight;
        requestAnimationFrame(function () {
          _scrollLock = false;
        });
      }

      // ════════════════════════════════════════════════════════════
      //  STATE
      // ════════════════════════════════════════════════════════════
      // ════════════════════════════════════════════════════════════
      //  AUTH — one-time password per browser session
      // ════════════════════════════════════════════════════════════
      var adminKey = sessionStorage.getItem("adminKey") || "";

      function authHeaders() {
        return { "Content-Type": "application/json", "x-admin-key": adminKey };
      }

      function showAuthGate() {
        var overlay = document.createElement("div");
        overlay.id = "auth-overlay";
        overlay.setAttribute(

              : "THE LORD'S CHURCH SERMON TRANSLATOR") +

          '<input id="auth-input" type="password" placeholder="Enter admin key\u2026" autofocus ' +

          'color:#fff;font-size:16px;width:260px;text-align:center;outline:none">' +
          '<div id="auth-error" style="color:#e55;font-size:13px;height:18px"></div>' +

              "onmouseout=\"this.style.color='#555';this.style.borderColor='#2a2a2a'\">" +
              "Viewer &rarr;</a>");
        document.body.appendChild(overlay);

        var input = document.getElementById("auth-input");
        input.addEventListener("keydown", function (e) {
          if (e.key !== "Enter") return;
          var val = input.value.trim();
          if (!val) return;
          // Test the key against a lightweight endpoint
          adminKey = val;
          fetch("/api/sync-pull?since=0", { headers: { "x-admin-key": val } })
            .then(function (r) {
              if (r.ok) {
                sessionStorage.setItem("adminKey", val);
                overlay.remove();
                log("Waiting for sermon\u2026", "info");
              } else {
                adminKey = "";
                document.getElementById("auth-error").textContent =

      var isViewer = location.search.indexOf("viewer") !== -1;
      var isRemote = !isViewer && location.search.indexOf("remote") !== -1;

      // Gate everything behind auth — if no stored key, show prompt
      // Viewer is public (read-only, no auth needed)
      if (!adminKey && !isViewer) {
        document.addEventListener("DOMContentLoaded", showAuthGate);
      }
      var sermonTitle = "";
      var isMuted = false; // when true, audio chunks are discarded before Groq

      let mediaRecorder = null;
      let audioChunks = [];
      let isListening = false; // session active (mic open)
      let micStream = null;
      let chunkTimer = null;
      let queue = []; // audio blobs waiting to be processed (FIFO)
      let busy = false; // true while a chunk is going through the pipeline
      let consoleOpen = false;
      let logHistory = []; // last 100 log entries, replayed into popup on open
      let consoleWindow = null; // reference to detached popup window

      const WINDOW_SIZE = 5; // recent segments sent as context to Claude
      const SUMMARY_EVERY = 8; // Haiku summarises every N segments
      let recentSegments = []; // sliding window of { korean, english }
      let allSegments = []; // full sermon history (for summary generation)
      let sermonSummary = ""; // rolling 3-sentence summary from Haiku
      let summarizing = false;
      let lastEnglishTail = ""; // tail of previous translation for continuity

      // ════════════════════════════════════════════════════════════
      //  API METRICS — rate limit tracking for Claude, Groq, Upstash
      // ════════════════════════════════════════════════════════════
      var apiMetrics = {
        claude: {
          reqLimit: 0,
          reqRemaining: 0,
          reqReset: "",
          tokLimit: 0,
          tokRemaining: 0,
          tokReset: "",
          callCount: 0,
        },
        groq: {
          reqLimit: 0,
          reqRemaining: 0,
          reqReset: "",
          tokLimit: 0,
          tokRemaining: 0,
          tokReset: "",
          callCount: 0,
        },
        upstash: { callCount: 0 },
      };
      var metricsOpen = false;
      var sessionCost = 0; // running Claude cost in dollars for this session
      var _sessionStartTime = 0; // epoch ms when Start was pressed
      var _sermonTimerInterval = null;

      // Cost per million tokens (USD) by model
      var MODEL_PRICING = {
        "claude-sonnet-4-20250514": {
          input: 3.0,
          cachedInput: 0.3,
          output: 15.0,
        },
        "claude-haiku-4-5-20251001": {
          input: 0.8,
          cachedInput: 0.08,
          output: 4.0,
        },
      };

      function accumulateCost(model, usage) {
        if (!usage) return;
        var pricing = MODEL_PRICING[model];
        if (!pricing) return;
        var inputTokens =
          (usage.input_tokens || 0) -
          (usage.cache_read_input_tokens || 0) -
          (usage.cache_creation_input_tokens || 0);
        var cachedTokens =
          (usage.cache_read_input_tokens || 0) +
          (usage.cache_creation_input_tokens || 0);
        var outputTokens = usage.output_tokens || 0;
        sessionCost +=
          (inputTokens / 1e6) * pricing.input +
          (cachedTokens / 1e6) * pricing.cachedInput +
          (outputTokens / 1e6) * pricing.output;
        refreshMetricsPanel();
      }

      function formatSermonTimer() {
        if (!_sessionStartTime) return "--:--";
        var elapsed = Math.floor((Date.now() - _sessionStartTime) / 1000);
        var h = Math.floor(elapsed / 3600);
        var m = Math.floor((elapsed % 3600) / 60);
        var s = elapsed % 60;
        if (h > 0)
          return (
            h +
            ":" +
            String(m).padStart(2, "0") +
            ":" +
            String(s).padStart(2, "0")
          );
        return m + ":" + String(s).padStart(2, "0");
      }

      function toggleMetricsPanel() {
        metricsOpen = !metricsOpen;
        var panel = document.getElementById("metrics-panel");
        if (panel) panel.classList.toggle("open", metricsOpen);
        var remotePanel = document.getElementById("remote-metrics-panel");
        if (remotePanel) remotePanel.classList.toggle("open", metricsOpen);
        // Sync to popup
        if (
          consoleWindow &&
          !consoleWindow.closed &&
          consoleWindow.toggleMetricsPanel
        ) {
          try {
            consoleWindow.setMetricsOpen(metricsOpen);
          } catch (_) {}
        }
      }

      function updateApiMetrics(service, rateLimit) {
        if (!rateLimit) return;
        var m = apiMetrics[service];
        if (!m) return;
        m.callCount++;
        if (service === "claude") {
          m.reqLimit =
            parseInt(rateLimit["anthropic-ratelimit-requests-limit"]) ||
            m.reqLimit;
          m.reqRemaining =
            parseInt(rateLimit["anthropic-ratelimit-requests-remaining"]) || 0;
          m.reqReset = rateLimit["anthropic-ratelimit-requests-reset"] || "";
          m.tokLimit =
            parseInt(rateLimit["anthropic-ratelimit-tokens-limit"]) ||
            m.tokLimit;
          m.tokRemaining =
            parseInt(rateLimit["anthropic-ratelimit-tokens-remaining"]) || 0;
          m.tokReset = rateLimit["anthropic-ratelimit-tokens-reset"] || "";
        } else if (service === "groq") {
          m.reqLimit =
            parseInt(rateLimit["x-ratelimit-limit-requests"]) || m.reqLimit;
          m.reqRemaining =
            parseInt(rateLimit["x-ratelimit-remaining-requests"]) || 0;
          m.reqReset = rateLimit["x-ratelimit-reset-requests"] || "";
          m.tokLimit =
            parseInt(rateLimit["x-ratelimit-limit-tokens"]) || m.tokLimit;
          m.tokRemaining =
            parseInt(rateLimit["x-ratelimit-remaining-tokens"]) || 0;
          m.tokReset = rateLimit["x-ratelimit-reset-tokens"] || "";
        }
        refreshMetricsPanel();
        // Push state so remote device receives updated metrics
        pushSync("state", {
          isListening: isListening,
          isMuted: isMuted,
          chunkMs: parseInt(
            (document.getElementById("chunk-ms") || {}).value || 25000,
          ),
        });
      }

      function meterColor(pct) {
        if (pct > 50) return "green";
        if (pct > 20) return "yellow";
        return "red";
      }

      function formatReset(val) {
        if (!val) return "—";
        // Groq returns durations like "1s", "2m30s", "1h2m3s"
        if (/^\d+[hms]/.test(val)) return val + " remaining";
        // Anthropic returns ISO timestamps
        try {
          var d = new Date(val);
          if (isNaN(d.getTime())) return val;
          return d.toLocaleTimeString("en-US", { hour12: false });
        } catch (_) {
          return val;
        }
      }

      function _updateMetricEls(doc, prefix) {
        ["claude", "groq"].forEach(function (svc) {
          var m = apiMetrics[svc];
          var reqPct = m.reqLimit ? (m.reqRemaining / m.reqLimit) * 100 : 0;
          var tokPct = m.tokLimit ? (m.tokRemaining / m.tokLimit) * 100 : 0;
          var reqFill = doc.getElementById(prefix + svc + "-req-fill");
          var tokFill = doc.getElementById(prefix + svc + "-tok-fill");
          if (reqFill) {
            reqFill.style.width = reqPct + "%";
            reqFill.className = "meter-fill " + meterColor(reqPct);
          }
          if (tokFill) {
            tokFill.style.width = tokPct + "%";
            tokFill.className = "meter-fill " + meterColor(tokPct);
          }
          var reqVal = doc.getElementById(prefix + svc + "-req-val");
          var tokVal = doc.getElementById(prefix + svc + "-tok-val");
          if (reqVal)
            reqVal.textContent = m.reqLimit
              ? m.reqRemaining + "/" + m.reqLimit
              : "—";
          if (tokVal)
            tokVal.textContent = m.tokLimit
              ? m.tokRemaining + "/" + m.tokLimit
              : "—";
          var resetEl = doc.getElementById(prefix + svc + "-reset");
          if (resetEl)
            resetEl.textContent = "Reset: " + formatReset(m.reqReset);
          var callsEl = doc.getElementById(prefix + svc + "-calls");
          if (callsEl) callsEl.textContent = "Calls: " + m.callCount;
        });
        var upEl = doc.getElementById(prefix + "upstash-calls");
        if (upEl) upEl.textContent = "Calls: " + apiMetrics.upstash.callCount;
        var costEl = doc.getElementById(prefix + "session-cost");
        if (costEl) costEl.textContent = "Cost: $" + sessionCost.toFixed(2);
        var timerEl = doc.getElementById(prefix + "sermon-timer");
        if (timerEl) timerEl.textContent = formatSermonTimer();
      }

      var _metricsTimer = 0;
      function refreshMetricsPanel(doc) {
        // Direct call with a specific doc (popup sync) — run immediately
        if (doc) {
          _updateMetricEls(doc, "");
          return;
        }
        // Debounce: at most once per 500ms
        if (_metricsTimer) return;
        _metricsTimer = setTimeout(function () {
          _metricsTimer = 0;
          if (!metricsOpen) return; // skip DOM work when panel is hidden
          _updateMetricEls(document, "");
          _updateMetricEls(document, "r-");
          if (consoleWindow && !consoleWindow.closed) {
            try {
              _updateMetricEls(consoleWindow.document, "");
            } catch (_) {}
          }
        }, 500);
      }

      // ════════════════════════════════════════════════════════════
      //  SERMON TITLE
      // ════════════════════════════════════════════════════════════

      // Apply a title coming from sync (no push)
      function applySermonTitle(title) {
        sermonTitle = title || "";
        var displayEl = document.getElementById("sermon-title-display");
        if (displayEl) {
          displayEl.textContent = sermonTitle
            ? "Sermon Title: " + sermonTitle
            : "";
          displayEl.style.display = sermonTitle ? "block" : "none";
        }
        // Sync inputs without re-triggering oninput
        ["sermon-title-input", "remote-sermon-title-input"].forEach(
          function (id) {
            var el = document.getElementById(id);
            if (el && el !== document.activeElement) el.value = sermonTitle;
          },
        );
      }

      // Called from user input — applies + pushes to Redis
      // If Korean is detected, auto-translates after a short debounce.
      var _titleTranslateTimer = null;
      var _titleTranslateVersion = 0;

      function setSermonTitle(title) {
        applySermonTitle(title);
        pushTypoSync();

        // Auto-translate if Korean characters detected
        if (/[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/.test(title)) {
          clearTimeout(_titleTranslateTimer);
          _titleTranslateTimer = setTimeout(function () {
            translateTitle(title);
          }, 600);
        }
      }

      async function translateTitle(koreanTitle) {
        var myVersion = ++_titleTranslateVersion;
        try {
          var resp = await fetch("/api/claude", {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({
              model: HAIKU_MODEL,
              max_tokens: 100,
              temperature: 0,
              system:
                "You are translating a Korean sermon title to English for a Christian church service at The Lord's Church in Iselin, New Jersey. Translate naturally and fluently. Return ONLY the English translation, nothing else.",
              messages: [{ role: "user", content: koreanTitle }],
            }),
          });
          if (!resp.ok || myVersion !== _titleTranslateVersion) return;
          var data = await resp.json();
          updateApiMetrics("claude", data._rateLimit);
          accumulateCost(HAIKU_MODEL, data.usage);
          var english = data.content
            .map(function (b) {
              return b.text || "";
            })
            .join("")
            .trim();
          if (english && myVersion === _titleTranslateVersion) {
            applySermonTitle(english);
            pushTypoSync();
          }
        } catch (e) {
          console.warn("[title translate]", e);
        }
      }

      // ════════════════════════════════════════════════════════════
      //  CONSOLE
      // ════════════════════════════════════════════════════════════
      function toggleConsole() {
        if (consoleWindow && !consoleWindow.closed) {

      function log(msg, cls) {
        cls = cls || "";
        var text =
          "[" +
          new Date().toLocaleTimeString("en-US", { hour12: false }) +
          "] " +
          msg;

        logHistory.push({ text: text, cls: cls });
        if (logHistory.length > 100) logHistory.shift();

        if (consoleWindow && !consoleWindow.closed) {
          consoleWindow.addLog(text, cls);
        }

        const wrap = document.getElementById("log-entries");
        const el = document.createElement("div");
        el.className = "log " + cls;
        el.textContent = text;
        wrap.appendChild(el);
        while (wrap.children.length > 150) wrap.removeChild(wrap.firstChild);
        if (consoleOpen) document.getElementById("log-panel").scrollTop = 99999;

      function updateQueueDepth() {

      function toast(msg) {

      // ════════════════════════════════════════════════════════════
      //  SYNC — bidirectional state sync via Upstash Redis
      //  Laptop pushes entries/state; phone pushes commands/edits.
      //  Both poll sync-pull for typography, edits, and commands.
      //  Typography uses a 1.5s grace period to prevent polls from
      //  overwriting in-progress slider drags.
      // ════════════════════════════════════════════════════════════

      // ── Typography sync (all devices) ────────────────────────────
      // Small debounce so rapid onchange bursts don't spam Redis
      var _typoTimer = null;
      function pushTypoSync() {
        _lastLocalTypoTime = Date.now();
        clearTimeout(_typoTimer);
        _typoTimer = setTimeout(function () {
          // Read from the ACTIVE slider for this page mode.
          // On remote, the main sliders exist but are hidden (display:none)
          // and retain stale default values — so we must prefer remote sliders.
          var fsEl = isRemote
            ? document.getElementById("remote-font-slider") ||
              document.getElementById("font-size-slider")
            : document.getElementById("font-size-slider") ||
              document.getElementById("remote-font-slider");
          var lhEl = isRemote
            ? document.getElementById("remote-spacing-slider") ||
              document.getElementById("line-height-slider")
            : document.getElementById("line-height-slider") ||
              document.getElementById("remote-spacing-slider");
          var fontSize = fsEl ? parseInt(fsEl.value) : 83;
          var lineHeight = lhEl ? parseInt(lhEl.value) : 15;
          var chunkEl =
            document.getElementById("chunk-ms") ||
            document.getElementById("remote-chunk-ms");
          var chunkMs = chunkEl ? parseInt(chunkEl.value) : 30000;
          var csEl = isRemote
            ? document.getElementById("remote-chunk-spacing-slider") ||
              document.getElementById("chunk-spacing-slider")
            : document.getElementById("chunk-spacing-slider") ||
              document.getElementById("remote-chunk-spacing-slider");
          var chunkSpacing = csEl ? parseInt(csEl.value) : 60;
          apiMetrics.upstash.callCount++;
          fetch("/api/sync-push", {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({
              type: "typo",
              data: {
                fontSize: fontSize,
                lineHeight: lineHeight,
                chunkSpacing: chunkSpacing,
                scrollSpeed: scrollSpeed,
                chunkMs: chunkMs,
                sermonTitle: sermonTitle,
              },
            }),
          }).catch(function (e) {
            console.warn("[typo sync]", e);
          });
        }, 300);
      }

      // Apply incoming typography to this device — updates CSS vars + all input UIs
      function applyTypoState(typo) {
        if (!typo) return;
        // Skip if this device is actively editing (prevents poll overwriting a drag in progress)
        if (Date.now() - _lastLocalTypoTime < 1500) return;
        if (typo.fontSize) {
          document.documentElement.style.setProperty(
            "--sentence-size",
            typo.fontSize + "px",
          );
          var fs = document.getElementById("font-size-input");
          if (fs) fs.value = typo.fontSize;
          var fss = document.getElementById("font-size-slider");
          if (fss) fss.value = typo.fontSize;
          var rfs = document.getElementById("remote-font-input");
          if (rfs) rfs.value = typo.fontSize;
          var rfss = document.getElementById("remote-font-slider");
          if (rfss) rfss.value = typo.fontSize;
        }
        if (typo.lineHeight) {
          document.documentElement.style.setProperty(
            "--line-height",
            (typo.lineHeight / 10).toFixed(1),
          );
          var lh = document.getElementById("line-height-input");
          if (lh) lh.value = typo.lineHeight;
          var lhs = document.getElementById("line-height-slider");
          if (lhs) lhs.value = typo.lineHeight;
          var rlh = document.getElementById("remote-spacing-input");
          if (rlh) rlh.value = typo.lineHeight;
          var rlhs = document.getElementById("remote-spacing-slider");
          if (rlhs) rlhs.value = typo.lineHeight;
        }
        if (typo.chunkSpacing) {
          document.documentElement.style.setProperty(
            "--chunk-spacing",
            typo.chunkSpacing + "px",
          );
          var csi = document.getElementById("chunk-spacing-input");
          if (csi) csi.value = typo.chunkSpacing;
          var css2 = document.getElementById("chunk-spacing-slider");
          if (css2) css2.value = typo.chunkSpacing;
          var rcsi = document.getElementById("remote-chunk-spacing-input");
          if (rcsi) rcsi.value = typo.chunkSpacing;
          var rcss = document.getElementById("remote-chunk-spacing-slider");
          if (rcss) rcss.value = typo.chunkSpacing;
        }
        if (typo.scrollSpeed) {
          scrollSpeed = typo.scrollSpeed;
          var ss = document.getElementById("scroll-speed-input");
          if (ss) ss.value = typo.scrollSpeed;
          var sss = document.getElementById("scroll-speed-slider");
          if (sss) sss.value = typo.scrollSpeed;
          var rss = document.getElementById("remote-scroll-input");
          if (rss) rss.value = typo.scrollSpeed;
          var rsss = document.getElementById("remote-scroll-slider");
          if (rsss) rsss.value = typo.scrollSpeed;
        }
        if (typo.chunkMs) {
          var cm = document.getElementById("chunk-ms");
          if (cm) cm.value = typo.chunkMs;
          var rcm = document.getElementById("remote-chunk-ms");
          if (rcm) rcm.value = typo.chunkMs;
        }
        if (typo.sermonTitle !== undefined) {
          applySermonTitle(typo.sermonTitle);
        }
      }

      // ── Laptop side ──────────────────────────────────────────────
      function pushSync(type, data) {
        if (isRemote || isViewer) return;
        apiMetrics.upstash.callCount++;
        // Piggyback metrics + recent logs onto state pushes
        if (type === "state") {
          data.apiMetrics = apiMetrics;
          data.sessionCost = sessionCost;
          data.sessionStartTime = _sessionStartTime;
          data.logTail = logHistory.slice(-30);
        }
        fetch("/api/sync-push", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ type: type, data: data }),
        }).catch(function () {}); // fire-and-forget; never block main flow
      }

      // Laptop polls sync-pull for commands + edits + typography in ONE fetch.
      // Uses since=9999999999999 to skip transcript entries (laptop already has them).
      var lastCommandId = Date.now(); // ignore stale commands from before this page load
      async function pollCommands() {
        if (isRemote) return;
        apiMetrics.upstash.callCount++;
        try {
          var resp = await fetch(
            "/api/sync-pull?since=9999999999999&sinceEdit=" + lastEditId,
            { headers: { "x-admin-key": adminKey } },
          );
          if (!resp.ok) return;
          var data = await resp.json();

          // Process remote commands (start, stop, mute, clear, setChunkMs)
          var cmd = data.command;
          if (cmd && cmd.command && cmd.id && cmd.id > lastCommandId) {
            lastCommandId = cmd.id;
            if (cmd.command === "start" && !isListening) startSession();
            else if (cmd.command === "stop" && isListening) stopSession();
            else if (cmd.command === "clear") clearAll();
            else if (cmd.command === "mute" && !isMuted) toggleMute();
            else if (cmd.command === "unmute" && isMuted) toggleMute();
            else if (cmd.command === "setChunkMs" && cmd.value) {
              var sel = document.getElementById("chunk-ms");
              if (sel) sel.value = cmd.value;
            }
          }

          // Apply remote edits and typography
          (data.edits || []).forEach(function (edit) {
            if (edit.id > lastEditId) lastEditId = edit.id;
            applyEdit(edit);
          });
          applyTypoState(data.typo);
        } catch (_) {}
      }

      // ── Remote (phone) side ──────────────────────────────────────
      var lastEntryId = 0;
      var lastEditId = 0;
      var lastClearedAt = 0;

      var _remoteSessionActive = false; // tracks whether we've seen isListening:true

      async function pollRemote() {
        apiMetrics.upstash.callCount++;
        try {
          var resp = await fetch(
            "/api/sync-pull?since=" + lastEntryId + "&sinceEdit=" + lastEditId,
            { headers: { "x-admin-key": adminKey } },
          );
          if (!resp.ok) {
            setRemoteStatus("offline");
            return;
          }
          var data = await resp.json();

          var isLive = data.state && data.state.isListening;

          if (data.state) updateRemoteState(data.state);

          // First poll while not live — skip rendering stale entries, just advance cursors
          if (!_remoteSessionActive && !isLive) {
            (data.entries || []).forEach(function (entry) {
              if (entry.id > lastEntryId) lastEntryId = entry.id;
            });
            (data.edits || []).forEach(function (edit) {
              if (edit.id > lastEditId) lastEditId = edit.id;
            });
            applyTypoState(data.typo);
            setRemoteStatus("ready");
            return;
          }

          // Session went live — mark active
          if (isLive) _remoteSessionActive = true;

          var newEntries = false;
          (data.entries || []).forEach(function (entry) {
            if (entry.id > lastEntryId) lastEntryId = entry.id;
            renderRemoteEntry(entry);
            newEntries = true;
          });
          if (newEntries) scrollToBottom();

          (data.edits || []).forEach(function (edit) {
            if (edit.id > lastEditId) lastEditId = edit.id;
            applyEdit(edit);
          });

          applyTypoState(data.typo);
          setRemoteStatus(isLive ? "live" : "ready");
        } catch (_) {
          setRemoteStatus("offline");
        }
      }

      function setRemoteStatus(status) {
        var el = document.getElementById("remote-status");
        if (!el) return;
        el.className = "remote-status " + status;
        el.textContent =
          status === "live"
            ? "\u25cf Live"
            : status === "offline"
              ? "\u25cb Offline"
              : "\u25cb Ready";
      }

      function updateRemoteState(state) {
        var btnStart = document.getElementById("remote-start");
        var btnStop = document.getElementById("remote-stop");
        if (!btnStart || !btnStop) return;
        btnStart.style.display = state.isListening ? "none" : "inline-block";
        btnStop.style.display = state.isListening ? "inline-block" : "none";
        if (state.isMuted !== undefined) {
          isMuted = state.isMuted;
          updateMuteBtn();
        }
        // Laptop called resetSession (on stop/start) — wipe phone DOM too
        if (state.clearedAt && state.clearedAt > lastClearedAt) {
          lastClearedAt = state.clearedAt;
          lastEntryId = 0;
          lastEditId = 0;
          document.getElementById("transcript").innerHTML = "";
        }

        // Sync logs from laptop
        if (state.logTail && state.logTail.length) {
          var rWrap = document.getElementById("remote-log-entries");
          if (rWrap) {
            rWrap.innerHTML = "";
            state.logTail.forEach(function (entry) {
              var el = document.createElement("div");
              el.className = "log " + (entry.cls || "");
              el.textContent = entry.text;
              rWrap.appendChild(el);
            });
            var rLog = document.getElementById("remote-log-panel");
            if (rLog) rLog.scrollTop = rLog.scrollHeight;
          }
        }

        // Apply metrics from laptop
        if (state.apiMetrics) {
          // Preserve remote's own upstash count, take everything else from laptop
          var localUpstash = apiMetrics.upstash.callCount;
          apiMetrics.claude = state.apiMetrics.claude || apiMetrics.claude;
          apiMetrics.groq = state.apiMetrics.groq || apiMetrics.groq;
          apiMetrics.upstash.callCount = localUpstash;
          if (state.sessionCost !== undefined) sessionCost = state.sessionCost;
          if (state.sessionStartTime !== undefined)
            _sessionStartTime = state.sessionStartTime;
          refreshMetricsPanel();
        }
      }

      async function sendCommand(command, value) {
        try {
          var payload = { command: command, id: Date.now() };
          if (value !== undefined) payload.value = value;
          await fetch("/api/sync-command", {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify(payload),
          });
        } catch (_) {}
      }

      // Push an edit from either device — no isRemote guard
      function pushEdit(entryId, sentences) {
        apiMetrics.upstash.callCount++;
        fetch("/api/sync-push", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({
            type: "editEntry",
            data: { id: Date.now(), entryId: entryId, sentences: sentences },
          }),
        }).catch(function () {});
      }

      // Attach blur listeners to an entry's sentences so edits sync to the other device
      function addEditListeners(entryEl, entryId) {
        entryEl.querySelectorAll(".sentence").forEach(function (span) {
          span.addEventListener("blur", function () {
            var texts = Array.from(entryEl.querySelectorAll(".sentence")).map(
              function (s) {
                return s.textContent.trim();
              },
            );
            pushEdit(entryId, texts);
          });
        });
      }

      // Apply an incoming edit to the matching entry in the local DOM
      function applyEdit(edit) {
        var entryEl = document.querySelector(
          '[data-entry-id="' + edit.entryId + '"]',
        );
        if (!entryEl) return;
        var spans = entryEl.querySelectorAll(".sentence");
        (edit.sentences || []).forEach(function (text, i) {
          if (spans[i] && document.activeElement !== spans[i]) {
            spans[i].textContent = text;
          }
        });
      }

      function renderRemoteEntry(entry) {
        // Skip if already rendered (prevents double-render on rapid back-to-back polls)
        if (
          entry.id &&
          document.querySelector('[data-entry-id="' + entry.id + '"]')
        )
          return;
        var wrap = document.getElementById("transcript");

        if (entry.type === "music") {
          var label = document.createElement("div");
          label.className = "music-label";
          label.textContent = entry.description;
          wrap.appendChild(label);
        } else {
          var div = document.createElement("div");
          div.className = "entry";
          div.dataset.entryId = String(entry.id);
          var html = (entry.sentences || [])
            .map(function (s) {
              return (
                '<span class="sentence" contenteditable="true">' +
                esc(s) +
                "</span>"
              );
            })
            .join("");
          if (entry.scripture && entry.scripture.length) {
            html += entry.scripture
              .filter(function (sc) {
                return sc.ref;
              })
              .map(function (sc) {
                return (
                  '<span class="scripture-callout">(' +
                  esc(sc.ref) +
                  (sc.note ? " \u2014 " + esc(sc.note) : "") +
                  ")</span>"
                );
              })
              .join("");
          }
          div.innerHTML = html;
          wrap.appendChild(div);
          addEditListeners(div, entry.id);
        }
      }

      var remotePanelOpen = false;

      function toggleRemotePanel() {
        remotePanelOpen = !remotePanelOpen;
        var panel = document.getElementById("remote-panel");
        if (!panel) return;
        panel.classList.toggle("open", remotePanelOpen);

          var logPanel = document.getElementById("remote-log-panel");
          if (logPanel) logPanel.scrollTop = 99999;
        }
      }

      function updateRemoteScrollSpeed(val) {
        scrollSpeed = parseInt(val);
        pushTypoSync();
      }

              panel.style.height =
                Math.max(160, Math.min(h, window.innerHeight * 0.9)) + "px";

              document.removeEventListener("mousemove", onMove);

            }
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
          });
          resizeHandle.addEventListener(
            "touchstart",
            function (e) {
              startY = e.touches[0].clientY;
              startH = panel.offsetHeight;
              function onMove(ev) {
                ev.preventDefault();
                var h = startH - (ev.touches[0].clientY - startY);

                document.removeEventListener("touchmove", onMove);

      var viewerPanelOpen = false;

      function toggleViewerPanel() {

      function setViewerStatus(status) {
        var el = document.getElementById("viewer-status");
        if (!el) return;
        el.className = "remote-status " + status;
        el.textContent =
          status === "live"
            ? "\u25cf Live"
            : status === "offline"
              ? "\u25cb Offline"
              : "\u25cb Ready";
      }

      var _viewerSessionActive = false; // tracks whether we've seen isListening:true

      async function pollViewer() {
        try {
          var resp = await fetch(
            "/api/sync-pull?since=" + lastEntryId + "&sinceEdit=" + lastEditId,
          );
          if (!resp.ok) {
            setViewerStatus("offline");
            return;
          }
          var data = await resp.json();

          var isLive = data.state && data.state.isListening;

          if (data.state) updateViewerState(data.state);

          // First poll while not live — skip rendering stale entries, just advance cursors
          if (!_viewerSessionActive && !isLive) {
            (data.entries || []).forEach(function (entry) {
              if (entry.id > lastEntryId) lastEntryId = entry.id;
            });
            (data.edits || []).forEach(function (edit) {
              if (edit.id > lastEditId) lastEditId = edit.id;
            });
            setViewerStatus("ready");
            return;
          }

          // Session went live — mark active
          if (isLive) _viewerSessionActive = true;

          var newEntries = false;
          (data.entries || []).forEach(function (entry) {
            if (entry.id > lastEntryId) lastEntryId = entry.id;
            renderViewerEntry(entry);
            newEntries = true;
          });
          if (newEntries) scrollToBottom();

          (data.edits || []).forEach(function (edit) {
            if (edit.id > lastEditId) lastEditId = edit.id;
            applyEdit(edit);
          });

          setViewerStatus(isLive ? "live" : "ready");
        } catch (_) {
          setViewerStatus("offline");
        }
      }

      function renderViewerEntry(entry) {
        if (
          entry.id &&
          document.querySelector('[data-entry-id="' + entry.id + '"]')
        )
          return;
        var wrap = document.getElementById("transcript");

        if (entry.type === "music") {
          var label = document.createElement("div");
          label.className = "music-label";
          label.textContent = entry.description;
          wrap.appendChild(label);
        } else {
          var div = document.createElement("div");
          div.className = "entry";
          div.dataset.entryId = String(entry.id);
          var html = (entry.sentences || [])
            .map(function (s) {
              return '<span class="sentence">' + esc(s) + "</span>";
            })
            .join("");
          if (entry.scripture && entry.scripture.length) {
            html += entry.scripture
              .filter(function (sc) {
                return sc.ref;
              })
              .map(function (sc) {
                return (
                  '<span class="scripture-callout">(' +
                  esc(sc.ref) +
                  (sc.note ? " \u2014 " + esc(sc.note) : "") +
                  ")</span>"
                );
              })
              .join("");
          }
          div.innerHTML = html;
          wrap.appendChild(div);
        }
      }

      function updateViewerState(state) {
        if (state.clearedAt && state.clearedAt > lastClearedAt) {
          lastClearedAt = state.clearedAt;
          lastEntryId = 0;
          lastEditId = 0;
          document.getElementById("transcript").innerHTML = "";
        }
      }

      // ════════════════════════════════════════════════════════════
      //  RECORDING — mic capture in configurable chunks (20/25/30s)
      //  Each chunk goes through: mute gate → size gate → queue → pipeline
      // ════════════════════════════════════════════════════════════
      async function startSession() {
        resetSession(); // clean slate each session
        log("Requesting microphone...", "info");
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          log("Microphone granted.", "info");
        } catch (e) {
          log("Mic error: " + e.message, "err");
          toast("Microphone error: " + e.message);
          return;
        }
        isListening = true;
        document.getElementById("btn-start").style.display = "none";
        document.getElementById("btn-stop").style.display = "inline-block";
        syncPopupState();
        pushSync("state", {
          isListening: true,
          isMuted: isMuted,
          chunkMs: parseInt(document.getElementById("chunk-ms").value),
        });
        log(
          "Remote: " + location.origin + location.pathname + "?remote",
          "info",
        );
        // Enter fullscreen
        if (!isRemote && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(function () {});
        }

        // Start sermon timer
        _sessionStartTime = Date.now();
        _sermonTimerInterval = setInterval(function () {
          updateSermonTimer();
        }, 1000);
        updateSermonTimer();

        recordChunk();
      }

      function updateSermonTimer() {
        var txt = formatSermonTimer();
        var ids = ["sermon-timer", "r-sermon-timer"];
        for (var i = 0; i < ids.length; i++) {
          var el = document.getElementById(ids[i]);
          if (el) el.textContent = txt;
        }
        if (consoleWindow && !consoleWindow.closed) {
          try {
            var pel = consoleWindow.document.getElementById("sermon-timer");
            if (pel) pel.textContent = txt;
          } catch (_) {}
        }
      }

      function recordChunk() {
        if (!isListening) return;
        audioChunks = [];

        var mime = bestMime();
        var ms = parseInt(document.getElementById("chunk-ms").value);
        log("Recording " + ms / 1000 + "s...");

        try {
          mediaRecorder = mime
            ? new MediaRecorder(micStream, { mimeType: mime })
            : new MediaRecorder(micStream);
        } catch (_) {
          mediaRecorder = new MediaRecorder(micStream);
        }

        mediaRecorder.ondataavailable = function (e) {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = function () {
          if (isMuted) {
            audioChunks = [];
            if (isListening) recordChunk();
            return;
          }
          if (!audioChunks.length) {
            log("Empty chunk, skipping.", "warn");
            if (isListening) recordChunk();
            return;
          }
          var actualMime = mediaRecorder.mimeType || mime || "audio/webm";
          var blob = new Blob(audioChunks, { type: actualMime });
          log("Chunk: " + (blob.size / 1024).toFixed(1) + " KB", "info");
          if (blob.size < 8000) {
            log("Chunk too small (silence), skipping.", "warn");
            if (isListening) recordChunk();
            return;
          }
          queue.push(blob);
          processNext();
          if (isListening) recordChunk();
        };

        mediaRecorder.start(500);

        chunkTimer = setTimeout(function () {
          if (mediaRecorder && mediaRecorder.state === "recording")
            mediaRecorder.stop();
        }, ms);
      }

      var _cachedMime = null;
      function bestMime() {
        if (_cachedMime !== null) return _cachedMime;
        var types = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/ogg;codecs=opus",
          "audio/mp4",
        ];
        for (var i = 0; i < types.length; i++) {
          if (MediaRecorder.isTypeSupported(types[i])) {
            _cachedMime = types[i];
            return _cachedMime;
          }
        }
        _cachedMime = "";
        return _cachedMime;
      }

      var _stoppedAt = 0; // epoch when session was stopped — pipeline skips if started before this

      function stopSession() {
        isListening = false;
        _stoppedAt = Date.now();
        if (_sermonTimerInterval) {
          clearInterval(_sermonTimerInterval);
          _sermonTimerInterval = null;
        }
        updateSermonTimer(); // freeze final time
        clearTimeout(chunkTimer);
        if (_activeClaudeController) {
          _activeClaudeController.abort();
          _activeClaudeController = null;
        }
        if (mediaRecorder && mediaRecorder.state !== "inactive")
          mediaRecorder.stop();
        if (micStream) {
          micStream.getTracks().forEach(function (t) {
            t.stop();
          });
          micStream = null;
        }

        // Flush pending queue so no more chunks enter the pipeline
        queue = [];
        updateQueueDepth();

        // Exit fullscreen
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        }

        document.getElementById("btn-start").style.display = "inline-block";
        document.getElementById("btn-stop").style.display = "none";
        log("Stopped.");
        if (!isRemote) downloadTranscript("Auto-save on stop");
        syncPopupState();

        // Full reset: wipe context + Redis after a short delay so any
        // in-flight entry push lands first, then the clear wipes it.
        setTimeout(function () {
          resetSession();
        }, 2000);
      }

      function clearAll() {
        // Visual-only: push existing text off-screen with a spacer, don't wipe context
        var transcript = document.getElementById("transcript");
