      // ════════════════════════════════════════════════════════════
      //  PIPELINE — sequential chunk processing
      //  Groq Whisper (KO speech-to-text) → hallucination filter
      //  → Claude Sonnet (KO→EN translation) → render + sync
      //  Chunks are processed one-at-a-time in FIFO order.
      // ════════════════════════════════════════════════════════════
      async function processNext() {
        updateQueueDepth();
        if (busy || !queue.length) return;
        busy = true;
        var blob = queue.shift();
        var chunkStarted = Date.now(); // track when this chunk entered the pipeline
        updateQueueDepth();

        try {
          // If session was stopped while we were queued, skip entirely
          if (_stoppedAt > chunkStarted) {
            busy = false;
            return;
          }

          log("Groq transcribing...");
          var korean = await groqTranscribe(blob);

          // If session was stopped during transcription, skip
          if (_stoppedAt > chunkStarted) {
            busy = false;
            return;
          }

          // A full 20-30s chunk producing only a few words is almost
          // certainly Whisper hallucinating on silence (e.g. "안녕하세요").
          // Real 25s of Korean speech yields 50-150+ characters.
          // Only flag chunks larger than 100 KB (~6+ seconds of audio).
          var trimmed = korean ? korean.trim() : "";
          var isLargeChunk = blob.size > 100000;
          var tooShort =
            isLargeChunk &&
            trimmed.length > 0 &&
            trimmed.length < 15 &&
            trimmed.split(/\s+/).length <= 3;
          if (!korean || trimmed.length < 3) {
            log("No speech detected.", "warn");
          } else if (tooShort) {
            log("Silence hallucination, skipping: " + trimmed, "warn");
          } else if (isHallucination(korean)) {
            log(
              "Hallucination detected, skipping: " + korean.substring(0, 80),
              "warn",
            );
          } else {
            log(
              "KO: " +
                korean.substring(0, 80) +
                (korean.length > 80 ? "..." : ""),
              "info",
            );
            log("Claude translating...");
            var result = await claudeTranslate(korean);

            // If session was stopped during translation, skip render+push
            if (_stoppedAt > chunkStarted) {
              busy = false;
              return;
            }

            if (result.music) {
              log("Music detected: " + result.music, "info");
              renderMusic(result.music);
            } else {
              log(
                "EN: " +
                  result.english.substring(0, 80) +
                  (result.english.length > 80 ? "..." : ""),
                "info",
              );

              var seg = { korean: korean, english: result.english };
              recentSegments.push(seg);
              if (recentSegments.length > WINDOW_SIZE) recentSegments.shift();
              allSegments.push(seg);

              var sentences = result.english.match(/[^.!?]+[.!?]+/g) || [
                result.english,
              ];
              lastEnglishTail = sentences.slice(-3).join(" ").trim();

              renderEntry(result);

              if (allSegments.length % SUMMARY_EVERY === 0 && !summarizing) {
                generateSermonSummary();
              }
            }
          }
        } catch (e) {
          log("Error: " + e.message, "err");
          toast(e.message);
        }

        busy = false;
        updateQueueDepth();
        processNext();
      }

      // Whisper hallucinations repeat the same phrase many times.
      // Count every consecutive word-pair; flag if any bigram appears 3+ times.
      // Threshold of 3 prevents false positives on naturally repeated phrases
      // like "the Lord" or "하나님이" which may legitimately appear twice in 30 s.
      //
      // Also detects sequential number counting hallucinations where Whisper
      // generates spelled-out numbers in sequence (e.g. "twenty-six twenty-seven
      // twenty-eight...") after hearing a number spoken in English.
      var _numberWords = {
        zero: 0,
        one: 1,
        two: 2,
        three: 3,
        four: 4,
        five: 5,
        six: 6,
        seven: 7,
        eight: 8,
        nine: 9,
        ten: 10,
        eleven: 11,
        twelve: 12,
        thirteen: 13,
        fourteen: 14,
        fifteen: 15,
        sixteen: 16,
        seventeen: 17,
        eighteen: 18,
        nineteen: 19,
        twenty: 20,
        thirty: 30,
        forty: 40,
        fifty: 50,
        sixty: 60,
        seventy: 70,
        eighty: 80,
        ninety: 90,
        hundred: 100,
      };

      function _parseSpelledNumber(words, start) {
        // Parse ONE spelled-out number starting at words[start].
        // Handles: "twenty-six" (hyphenated, 1 word), "thirty" (1 word),
        // "one hundred" (2 words), "two hundred thirty-four" (3 words).
        // Returns {value, consumed} or null.
        var i = start,
          val = 0,
          got = false;
        while (i < words.length) {
          var w = words[i].toLowerCase().replace(/,$/, "");
          var parts = w.split("-");
          var partVal = 0,
            partOk = false;
          for (var p = 0; p < parts.length; p++) {
            var n = _numberWords[parts[p]];
            if (n === undefined) break;
            if (n === 100) {
              partVal = (partVal || 1) * 100;
            } else {
              partVal += n;
            }
            partOk = true;
          }
          if (!partOk || p < parts.length) break;
          // If we already have a non-hundred value and this word adds
          // another non-hundred value, it's a new number — stop here.
          // e.g. val=26 and partVal=27 means "twenty-six twenty-seven" = two numbers
          if (got && partVal !== 100 && partVal < 100 && val % 100 !== 0) break;
          if (partVal === 100) {
            val = (val || 1) * 100;
          } else {
            val += partVal;
          }
          got = true;
          i++;
        }
        return got ? { value: val, consumed: i - start } : null;
      }

      function _hasSequentialNumbers(text) {
        var words = text.trim().split(/\s+/);
        var consecutive = 0,
          lastNum = null;
        var i = 0;
        while (i < words.length) {
          var parsed = _parseSpelledNumber(words, i);
          if (parsed && parsed.value >= 0 && parsed.value <= 9999) {
            if (lastNum !== null && parsed.value === lastNum + 1) {
              consecutive++;
              if (consecutive >= 9) return true; // 10+ sequential numbers
            } else {
              consecutive = 0;
            }
            lastNum = parsed.value;
            i += parsed.consumed;
          } else {
            // also check for digit numbers like "26 27 28"
            var digitMatch = words[i].match(/^(\d+)[,.]?$/);
            if (digitMatch) {
              var dv = parseInt(digitMatch[1], 10);
              if (lastNum !== null && dv === lastNum + 1) {
                consecutive++;
                if (consecutive >= 9) return true;
              } else {
                consecutive = 0;
              }
              lastNum = dv;
            } else {
              // non-number word breaks the chain
              // but allow small gaps (e.g. "twenty-six, twenty-seven, twenty-eight")
              lastNum = null;
              consecutive = 0;
            }
            i++;
          }
        }
        return false;
      }

      // Multi-layered Whisper hallucination detector.
      // Whisper on near-silence produces distinctive garbage patterns:
      //   1. Repeated phrases (bigram frequency)
      //   2. Sequential number counting
      //   3. Mixed scripts (Korean + Japanese/Chinese)
      //   4. Low Korean density (mostly non-Korean in what should be Korean audio)
      //   5. High script diversity (3+ script families = gibberish soup)
      function isHallucination(text) {
        var words = text.trim().split(/\s+/);
        if (words.length < 6) return false;

        // 1. Repeated bigrams — same word pair 5+ times
        var seen = {};
        for (var i = 0; i < words.length - 1; i++) {
          var bi = words[i] + "\x00" + words[i + 1];
          seen[bi] = (seen[bi] || 0) + 1;
          if (seen[bi] >= 5) return true;
        }

        // 2. Sequential number counting (twenty-six, twenty-seven, ...)
        if (_hasSequentialNumbers(text)) return true;

        // 3–5: Script analysis on the non-whitespace characters
        var chars = text.replace(/\s/g, "");
        var koCount = 0; // Korean syllables + jamo
        var jaCount = 0; // Japanese hiragana + katakana
        var cjkCount = 0; // CJK unified ideographs (Chinese hanzi)
        var latCount = 0; // Latin letters
        var digCount = 0; // Digits
        var otherCount = 0;
        for (var c = 0; c < chars.length; c++) {
          var code = chars.charCodeAt(c);
          if (
            (code >= 0xac00 && code <= 0xd7af) ||
            (code >= 0x1100 && code <= 0x11ff) ||
            (code >= 0x3130 && code <= 0x318f)
          ) {
            koCount++;
          } else if (
            (code >= 0x3040 && code <= 0x309f) ||
            (code >= 0x30a0 && code <= 0x30ff)
          ) {
            jaCount++;
          } else if (code >= 0x4e00 && code <= 0x9fff) {
            cjkCount++;
          } else if (
            (code >= 0x41 && code <= 0x5a) ||
            (code >= 0x61 && code <= 0x7a)
          ) {
            latCount++;
          } else if (code >= 0x30 && code <= 0x39) {
            digCount++;
          } else {
            otherCount++;
          }
        }

        // 3. Mixed scripts — Korean + Japanese kana should never co-occur
        if (koCount > 0 && jaCount > 0) return true;

        // 4. Low Korean density — real Korean sermon speech is predominantly
        //    Korean syllables. English Bible names or short phrases are fine,
        //    but if Korean chars make up less than 25% of alphabetic content
        //    (excluding digits/punctuation), it's likely hallucinated.
        var alphaTotal = koCount + jaCount + cjkCount + latCount;
        if (alphaTotal > 10 && koCount > 0 && koCount / alphaTotal < 0.25)
          return true;

        // 5. High script diversity — text spanning 3+ script families is gibberish.
        //    Normal Korean sermon text uses at most 2 (Korean + some Latin/digits).
        var scriptFamilies = 0;
        if (koCount > 0) scriptFamilies++;
        if (jaCount > 0) scriptFamilies++;
        if (cjkCount > 0) scriptFamilies++;
        if (latCount > 2) scriptFamilies++; // ignore 1-2 stray Latin chars
        if (scriptFamilies >= 3) return true;

        return false;
      }

      // ════════════════════════════════════════════════════════════
      //  GROQ — Whisper Large v3 speech-to-text
      //  Sends base64 audio + previous Korean text as context prompt.
      //  No fallback keywords on first segment (causes hallucinations).
      //  Retries up to 3× with exponential backoff on failure.
      // ════════════════════════════════════════════════════════════
      async function groqTranscribe(blob) {
        var mimeMap = {
          "audio/webm": "webm",
          "audio/ogg": "ogg",
          "audio/mp4": "mp4",
          "audio/mpeg": "mp3",
          "audio/wav": "wav",
        };
        var baseMime = (blob.type || "audio/webm").split(";")[0];
        var ext = mimeMap[baseMime] || "webm";

        var audioBase64 = await new Promise(function (res, rej) {
          var reader = new FileReader();
          reader.onload = function () {
            res(reader.result.split(",")[1]);
          };
          reader.onerror = function () {
            rej(new Error("Failed to read audio"));
          };
          reader.readAsDataURL(blob);
        });

        // Seed Whisper with last known Korean text for domain vocabulary priming.
        // Falls back to core theological terms on the very first segment.
        // Use the previous segment's Korean as the Whisper context prompt.
        // No fallback keywords — sending domain terms to Whisper on silence
        // causes it to hallucinate those exact words back.
        var whisperPrompt = recentSegments.length
          ? recentSegments[recentSegments.length - 1].korean
              .replace(/[\r\n]+/g, " ")
              .trim()
              .slice(0, 400)
          : "";

        var lastErr;
        for (var attempt = 1; attempt <= 3; attempt++) {
          try {
            var controller = new AbortController();
            var timer = setTimeout(function () {
              controller.abort();
            }, 40000);
            var resp;
            try {
              resp = await fetch("/api/groq", {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify({
                  audioBase64: audioBase64,
                  mimeType: baseMime,
                  ext: ext,
                  prompt: whisperPrompt,
                }),
                signal: controller.signal,
              });
            } finally {
              clearTimeout(timer);
            }
            if (!resp.ok) {
              var msg = "Groq HTTP " + resp.status;
              try {
                var j = await resp.json();
                msg = j.error || msg;
              } catch (_) {}
              throw new Error("Groq: " + msg);
            }
            var groqData = await resp.json();
            updateApiMetrics("groq", groqData._rateLimit);
            return (groqData.text || "").trim();
          } catch (e) {
            lastErr = e;
            if (attempt < 3) {
              log("Groq retry " + attempt + "...", "warn");
              await new Promise(function (r) {
                setTimeout(r, 1000 * attempt);
              });
            }
          }
        }
        throw lastErr;
      }

      // ════════════════════════════════════════════════════════════
      //  CLAUDE — Sonnet translation (KO → EN)
      //  Prompt includes: rolling sermon summary + last 3 translated
      //  segments for terminology consistency + tail of previous segment
      //  for cross-chunk sentence continuation. Retries 3× on failure.
      // ════════════════════════════════════════════════════════════
      // Assemble user prompt: summary (theme) + recent segments (terminology) + tail (continuity) + new Korean
      function buildPrompt(korean) {
        var p = "";
        if (sermonSummary) p += "SERMON SUMMARY:\n" + sermonSummary + "\n\n";
        if (recentSegments.length) {
          p += "RECENT TRANSCRIPT:\n";
          recentSegments.forEach(function (s, i) {
            p += "[" + (i + 1) + "] " + s.english + "\n";
          });
          p += "\n";
        }
        // Only send tail when recentSegments is empty (otherwise it's
        // redundant — the tail is already the end of the last segment).
        if (lastEnglishTail && !recentSegments.length) {
          p += 'PREVIOUS SEGMENT ENDED WITH:\n"' + lastEnglishTail + '"\n\n';
        }
        p += "NEW SEGMENT:\n" + korean;
        return p;
      }

      var SONNET_MODEL = "claude-sonnet-4-20250514";
      var HAIKU_MODEL = "claude-haiku-4-5-20251001";
      var _fallbackLevel = 0; // 0=sonnet, 1=haiku
      var _fallbackTimestamp = 0; // when we fell back — try primary again after 2 min
      var _activeClaudeController = null; // AbortController for in-flight Claude call

      async function claudeTranslate(korean) {
        var systemText =
          "You are a Korean-to-English translation assistant for a live Christian church service displayed on screen.\n\n" +
          "The microphone may pick up not just the pastor speaking, but also musical instruments (piano, guitar, organ, drums, etc.), or ambient sounds.\n\n" +
          "RULES:\n" +
          '1. If the text you receive contains ANY Korean words or phrases, it is ALWAYS speech — translate it. Never classify Korean text as music. Only return {"music":"description"} if the text contains absolutely zero Korean and consists entirely of descriptions of sounds/instruments in another language. When in doubt, always translate — a missed translation is far less harmful than silently dropping real sermon content.\n' +
          "2. If the audio contains spoken Korean sermon content (even alongside music), translate it normally. The pastor frequently says numbers, Bible references, and English words mid-sermon — these are legitimate speech, NOT music. A segment of numbers (e.g. verse numbers, page numbers, monetary amounts) should be translated/formatted as sermon content, not classified as music.\n" +
          "3. Translate naturally and fluently. No wooden or literal phrasing.\n" +
          "4. Use context to maintain consistent terminology and complete sentences cut off mid-thought.\n" +
          "5. Remove all filler words (um, uh, and Korean equivalents: \uc74c, \uc5b4, \uadf8, \uc774\uc81c, \uadf8\ub83c\uc11c, etc.) and stutters.\n" +
          "6. Preserve theological terms: \ud558\ub098\ub2d8\u2192God | \uc608\uc218\ub2d8\u2192Jesus Christ | \uc131\ub839\u2192the Holy Spirit | \uc8fc\ub2d8\u2192the Lord | \ub9d0\uc3f4\u2192the Word | \uc740\ud61c\u2192grace | \uad6c\uc6d0\u2192salvation | \uc2ed\uc790\uac00\u2192the cross | \ubd80\ud65c\u2192the resurrection | \ubbf8\ub364\u2192faith | \uae30\ub3c4\u2192prayer\n" +
          "7. Convert Korean Bible references: \uc694\ud55c\ubcf5\uc74c 3\uc7a5 16\uc808\u2192John 3:16 | \uc2dc\ud3b8 23\ud3b8\u2192Psalm 23\n" +
          "8. Audio is split into chunks mid-speech. Never begin with a stray closing quote/apostrophe from a previous chunk, and never end with an unclosed opening quote/apostrophe. If a quote is cut off mid-chunk, close it naturally or omit the quote marks entirely.\n\n" +
          "9. The church name is 'The Lord's Church' located in Iselin, New Jersey and the head pastor is 'Kim Nam Soo' and the regular pastor is 'Chun Min Sung'. If relevant, you can include them in the translation for clarity and naturalness, but they are not required to be mentioned in every segment.\n\n" +
          "10. Dawn service should be called morning prayer.\n" +
          "11. Don't be too sharp and acerbic. \n" +
          "12. For any difficult to understand church vernacular add a small simple blurb in parentheses next to the word. \n" +
          "13. Refer to audience as 'you all' or 'congregation' not 'saints' or something along the lines of 'saints' \n" +
          "14. If there are cultural references add a small simple blurb in parentheses next to the word or reference. \n" +
          "15. When PREVIOUS SEGMENT ENDED WITH is provided and this new segment completes that thought, begin your translation with the continuation — do NOT repeat what was already said. Flow on naturally.\n\n" +
          "Respond ONLY in valid JSON, no markdown:\n" +
          'For speech: {"english":"translated text","scripture":[{"ref":"John 3:16","note":""}]}\n' +
          'For music only: {"music":"description of what is playing"}';

        // Use structured system format with cache_control for prompt caching.
        // The system prompt is identical for every call, so caching it saves ~90%
        // of system prompt input token costs after the first call.
        var system = [
          {
            type: "text",
            text: systemText,
            cache_control: { type: "ephemeral" },
          },
        ];

        var prompt = buildPrompt(korean);

        // Single fetch to Claude with a given model
        async function tryModel(model) {
          var controller = new AbortController();
          _activeClaudeController = controller;
          var timer = setTimeout(function () {
            controller.abort();
          }, 30000);
          var resp;
          try {
            resp = await fetch("/api/claude", {
              method: "POST",
              headers: authHeaders(),
              body: JSON.stringify({
                model: model,
                max_tokens: 250,
                temperature: 0,
                system: system,
                messages: [{ role: "user", content: prompt }],
              }),
              signal: controller.signal,
            });
          } finally {
            clearTimeout(timer);
            _activeClaudeController = null;
          }

          if (!resp.ok) {
            var msg = "Claude HTTP " + resp.status;
            var isOverloaded = resp.status === 529 || resp.status === 504;
            try {
              var j = await resp.json();
              msg = j.error?.message || msg;
              if (msg.toLowerCase().indexOf("overloaded") !== -1)
                isOverloaded = true;
            } catch (_) {}
            var err = new Error("Claude: " + msg);
            err.overloaded = isOverloaded;
            throw err;
          }

          var data = await resp.json();
          updateApiMetrics("claude", data._rateLimit);
          accumulateCost(model, data.usage);
          var raw = data.content
            .map(function (b) {
              return b.text || "";
            })
            .join("")
            .trim();
          try {
            return JSON.parse(
              raw.replace(/^```json\n?|^```\n?|\n?```$/gm, "").trim(),
            );
          } catch (_) {
            return { english: raw, scripture: [] };
          }
        }

        // ── While on Haiku fallback: try Sonnet again after 2 minutes ──
        if (_fallbackLevel === 1) {
          if (Date.now() - _fallbackTimestamp > 120000) {
            try {
              var result = await tryModel(SONNET_MODEL);
              _fallbackLevel = 0;
              log("Sonnet is back — resuming primary model.", "info");
              return result;
            } catch (e) {
              _fallbackTimestamp = Date.now(); // reset timer
            }
          }
          return await tryModel(HAIKU_MODEL);
        }

        // ── Primary path: Sonnet (1 attempt) → Haiku (1 attempt) ──
        try {
          return await tryModel(SONNET_MODEL);
        } catch (e) {
          _fallbackLevel = 1;
          _fallbackTimestamp = Date.now();
          log("Sonnet overloaded — falling back to Haiku.", "warn");
          return await tryModel(HAIKU_MODEL);
        }
      }

      // ════════════════════════════════════════════════════════════
      //  BACKGROUND SUMMARY
      //  Every SUMMARY_EVERY segments, Haiku produces a rolling 3-sentence
      //  summary. Uses incremental approach: sends previous summary + only
      //  the latest batch of segments (not the entire transcript), so Haiku
      //  input stays ~constant regardless of sermon length.
      // ════════════════════════════════════════════════════════════
      async function generateSermonSummary() {
        summarizing = true;
        log("Updating sermon summary...", "info");

        // Only send the latest batch, not the entire sermon
        var startIdx = Math.max(0, allSegments.length - SUMMARY_EVERY);
        var recentTranscript = allSegments
          .slice(startIdx)
          .map(function (s, i) {
            return "[" + (startIdx + i + 1) + "] " + s.english;
          })
          .join("\n");

        // First summary: cold start. Later summaries: build on the previous one.
        var prompt = sermonSummary
          ? "Here is your previous summary of this sermon:\n" +
            sermonSummary +
            "\n\nHere are the newest segments:\n" +
            recentTranscript +
            "\n\nUpdate your summary to incorporate the new content. Keep it to 3 sentences covering: main theme, key points, central scriptures, direction. Plain prose only."
          : "Summarize this Christian sermon in 3 sentences for a translation assistant. Cover: main theme, key points, central scriptures, direction. Plain prose only.\n\n" +
            recentTranscript;

        try {
          var controller = new AbortController();
          var timer = setTimeout(function () {
            controller.abort();
          }, 20000);
          var resp;
          try {
            resp = await fetch("/api/claude", {
              method: "POST",
              headers: authHeaders(),
              body: JSON.stringify({
                model: "claude-haiku-4-5-20251001",
                max_tokens: 200,
                temperature: 0,
                system: [
                  {
                    type: "text",
                    text: "You are a sermon summarization assistant. Produce concise 3-sentence summaries of Christian sermons.",
                    cache_control: { type: "ephemeral" },
                  },
                ],
                messages: [{ role: "user", content: prompt }],
              }),
              signal: controller.signal,
            });
          } finally {
            clearTimeout(timer);
          }
          if (resp.ok) {
            var data = await resp.json();
            updateApiMetrics("claude", data._rateLimit);
            accumulateCost(HAIKU_MODEL, data.usage);
            sermonSummary = data.content
              .map(function (b) {
                return b.text || "";
              })
              .join("")
              .trim();
            log("Summary updated.", "info");
          }
        } catch (e) {
          log("Summary failed: " + e.message, "warn");
        }
        summarizing = false;
      }

      // ════════════════════════════════════════════════════════════
      //  DOWNLOAD TRANSCRIPT
      // ════════════════════════════════════════════════════════════
      function downloadTranscript(reason) {
        var transcriptEl = document.getElementById("transcript");
        var entries = transcriptEl.querySelectorAll(".entry, .music-label");
        if (!entries.length) return;

        var date = new Date().toLocaleDateString("en-US", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });
        var time = new Date().toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
        });

        var lines = [];
        lines.push("SERMON TRANSCRIPT");
        lines.push(date + " at " + time);
        if (reason) lines.push("(" + reason + ")");
        lines.push("");
        lines.push("─".repeat(60));
        lines.push("");

        var segCount = 0;
        entries.forEach(function (el) {
          if (el.classList.contains("music-label")) {
            lines.push("\u266a " + el.textContent.trim());
            lines.push("");
          } else {
            var spans = el.querySelectorAll(".sentence");
            if (spans.length) {
              var text = Array.from(spans)
                .map(function (s) {
                  return s.textContent.trim();
                })
                .join(" ");
              lines.push(text);
              lines.push("");
              segCount++;
            }
          }
        });

        lines.push("─".repeat(60));
        lines.push(segCount + " segments transcribed.");

        var blob = new Blob([lines.join("\n")], {
          type: "text/plain;charset=utf-8",
        });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        var filename =
          "sermon-" + new Date().toISOString().slice(0, 10) + ".txt";
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        log("Transcript downloaded: " + filename, "info");
      }

      // ════════════════════════════════════════════════════════════
      //  RENDER — display translated text on screen
      //  Splits English into sentences, highlights scripture refs,
      //  makes each sentence contenteditable for inline corrections.
      //  Pushes each entry to Redis for phone sync.
      // ════════════════════════════════════════════════════════════
      function renderMusic(description) {
        var wrap = document.getElementById("transcript");
        var label = document.createElement("div");
        label.className = "music-label";
        label.textContent = description;
        wrap.appendChild(label);
        scrollToBottom();
        pushSync("entry", {
          id: Date.now(),
          type: "music",
          description: description,
        });
      }

      function renderEntry(result) {
        var entryId = Date.now();
        var wrap = document.getElementById("transcript");
        var entry = document.createElement("div");
        entry.className = "entry";
        entry.dataset.entryId = String(entryId);

        // Split english into individual sentences for easier reading
        // Strip leading quote/apostrophe artifacts from chunk-boundary continuation
        var englishText = (result.english || "").replace(
          /^[\s\u0027\u0022\u2018\u2019\u201C\u201D]+/,
          "",
        );
        var rawSentences = englishText.match(/[^.!?]+[.!?]*/g) || [englishText];
        // Filter out empty strings and strip leading quote/apostrophe artifacts from each sentence
        var sentences = rawSentences
          .map(function (s) {
            return s.replace(/^[\s\u0027\u0022\u2018\u2019\u201C\u201D]+/, "");
          })
          .filter(function (s) {
            return s.trim().length > 0;
          });

        var sentencesHTML = sentences
          .map(function (s) {
            var escaped = esc(s.trim());
            // Highlight any scripture refs inline
            if (result.scripture && result.scripture.length) {
              result.scripture.forEach(function (sc) {
                if (!sc.ref) return;
                var safe = sc.ref.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                escaped = escaped.replace(
                  new RegExp(safe, "g"),
                  '<span style="color:#666;border-bottom:1px solid #2a2a2a">' +
                    sc.ref +
                    "</span>",
                );
              });
            }
            return (
              '<span class="sentence" contenteditable="true">' +
              escaped +
              "</span>"
            );
          })
          .join("");

        var scriptureBlocks = (result.scripture || [])
          .filter(function (s) {
            return s.ref;
          })
          .map(function (s) {
            return (
              '<span class="scripture-callout">(' +
              esc(s.ref) +
              (s.note ? " \u2014 " + esc(s.note) : "") +
              ")</span>"
            );
          })
          .join("");

        entry.innerHTML = sentencesHTML + scriptureBlocks;

        wrap.appendChild(entry);
        addEditListeners(entry, entryId);
        scrollToBottom();
        pushSync("entry", {
          id: entryId,
          type: "entry",
          sentences: sentences.map(function (s) {
            return s.trim();
          }),
          scripture: result.scripture || [],
        });
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ════════════════════════════════════════════════════════════
      //  TYPOGRAPHY CONTROLS — dual slider + number input
      //  oninput: live CSS preview + extend grace period (no Redis push)
      //  onchange: commit to CSS + push to Redis for cross-device sync
      // ════════════════════════════════════════════════════════════

      // Live preview only (oninput) — no Redis push.
      // Also extends the grace period so pollRemote can't overwrite an in-progress drag.
      function applyTypographyLocal(fs, lh, cs) {
        _lastLocalTypoTime = Date.now();
        if (fs !== null && fs !== undefined)
          document.documentElement.style.setProperty(
            "--sentence-size",
            parseInt(fs) + "px",
          );
        if (lh !== null && lh !== undefined)
          document.documentElement.style.setProperty(
            "--line-height",
            (parseInt(lh) / 10).toFixed(1),
          );
        if (cs !== null && cs !== undefined)
          document.documentElement.style.setProperty(
            "--chunk-spacing",
            parseInt(cs) + "px",
          );
      }

      // Commit (onchange) — applies CSS vars + pushes to Redis.
      // Must prefer the ACTIVE device's input — on remote, the hidden
      // laptop inputs still exist in the DOM with stale default values.
      function applyTypography() {
        var fsEl = isRemote
          ? document.getElementById("remote-font-input") ||
            document.getElementById("font-size-input")
          : document.getElementById("font-size-input") ||
            document.getElementById("remote-font-input");
        var lhEl = isRemote
          ? document.getElementById("remote-spacing-input") ||
            document.getElementById("line-height-input")
          : document.getElementById("line-height-input") ||
            document.getElementById("remote-spacing-input");
        var csEl = isRemote
          ? document.getElementById("remote-chunk-spacing-input") ||
            document.getElementById("chunk-spacing-input")
          : document.getElementById("chunk-spacing-input") ||
            document.getElementById("remote-chunk-spacing-input");
        var fontSize = fsEl ? parseInt(fsEl.value) : 83;
        var lineHeight = lhEl ? parseInt(lhEl.value) : 15;
        var chunkSpacing = csEl ? parseInt(csEl.value) : 60;

        document.documentElement.style.setProperty(
          "--sentence-size",
          fontSize + "px",
        );
        document.documentElement.style.setProperty(
          "--line-height",
          (lineHeight / 10).toFixed(1),
        );
        document.documentElement.style.setProperty(
          "--chunk-spacing",
          chunkSpacing + "px",
        );
        pushTypoSync();
      }

      // Init CSS vars on load; block Enter inside editable sentences
      // ── Wake Lock — prevent screen sleep while app is open ──
      var _wakeLock = null;
      async function requestWakeLock() {
        try {
          if ("wakeLock" in navigator) {
            _wakeLock = await navigator.wakeLock.request("screen");
            _wakeLock.addEventListener("release", function () {
              _wakeLock = null;
            });
          }
        } catch (_) {}
      }
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") requestWakeLock();
      });

      document.addEventListener("DOMContentLoaded", function () {
        requestWakeLock();
        window.addEventListener("resize", _recheckViewportFill);
        if (adminKey) log("Waiting for sermon\u2026", "info");
        document
          .getElementById("transcript")
          .addEventListener("keydown", function (e) {
            if (e.key === "Enter") e.preventDefault();
          });

        // Smart scroll detection — disable auto-follow when user scrolls up
        (function () {
          var main = document.getElementById("main");
          var _sct = null;

          main.addEventListener("scroll", function () {
            if (_scrollLock) return; // our own animation — ignore
            clearTimeout(_sct);
            _sct = setTimeout(function () {
              var atBot =
                main.scrollHeight - main.scrollTop - main.clientHeight < 80 ||
                (_scrollTarget > 0 &&
                  Math.abs(main.scrollTop - _scrollTarget) < 80);
              if (autoScroll !== atBot) {
                autoScroll = atBot;
                updateFollowBtn();
                // User scrolled back to bottom — restart the teleprompter
                if (atBot) scrollToBottom();
              }
            }, 120);
          });

          // User intentionally scrolling — cancel animation immediately
          main.addEventListener("wheel", cancelScrollAnim, { passive: true });
          main.addEventListener("touchstart", cancelScrollAnim, {
            passive: true,
          });
        })();

        if (isViewer) {
          initViewer();
        } else if (isRemote) {
          initRemote();
        } else {
          applyTypography();
          setInterval(pollCommands, 3000);
        }
      });

      // ════════════════════════════════════════════════════════════
      //  RESIZE CONSOLE DRAWER
      // ════════════════════════════════════════════════════════════
      (function () {
        var handle = document.getElementById("resize-handle");
        var drawer = document.getElementById("console-drawer");
        var startY = 0;
        var startH = 0;
        var dragging = false;

        handle.addEventListener("mousedown", function (e) {
          dragging = true;
          startY = e.clientY;
          startH = drawer.offsetHeight;
          document.body.style.userSelect = "none";
          e.preventDefault();
        });

        document.addEventListener("mousemove", function (e) {
          if (!dragging) return;
          var delta = startY - e.clientY; // drag up = bigger
          var newH = Math.min(
            Math.max(startH + delta, 160),
            window.innerHeight * 0.9,
          );
          drawer.style.height = newH + "px";
        });

        document.addEventListener("mouseup", function () {
          dragging = false;
          document.body.style.userSelect = "";
        });

        // Touch support
        handle.addEventListener(
          "touchstart",
          function (e) {
            dragging = true;
            startY = e.touches[0].clientY;
            startH = drawer.offsetHeight;
            e.preventDefault();
          },
          { passive: false },
        );

        document.addEventListener(
          "touchmove",
          function (e) {
            if (!dragging) return;
            var delta = startY - e.touches[0].clientY;
            var newH = Math.min(
              Math.max(startH + delta, 160),
              window.innerHeight * 0.9,
            );
            drawer.style.height = newH + "px";
          },
          { passive: true },
        );

        document.addEventListener("touchend", function () {
          dragging = false;
        });
      })();
    </script>
  </body>
</html>
